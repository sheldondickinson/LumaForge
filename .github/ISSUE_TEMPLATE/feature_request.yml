name: Feature request
description: Propose a scoped product improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: history
    attributes:
      label: History and compatibility impact
      description: Could this affect permanent identifiers, historical assignments, migrations, or xLights snapshots?
